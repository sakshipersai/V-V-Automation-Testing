<!DOCTYPE html>
<html>
    <head>
        <title> Contract form</title>
        <style>
            body{
                font-family: arial; 
            background-color: rgb(204, 172, 133);         
         }
         .form-card{
            width: 200
            px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 1);

         }
         input,textarea{
            text-align: center;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid cornsilk;
            border-radius: 5px;
         }
         button{
            background-color: aqua;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
         }
         button:hover{
            background-color: rgb(246, 248, 247);
         }
         h2{
            text-align: center;
         }
        </style>
    </head>
    <body>
        <div class="form card">
            <h2>Contact us</h2>
            <form>
                <input type="text" placeholder="Sakshi" required>
                <input type="email" placeholder="Sakshi@capgemini.com" required>
                <textarea rows="4" placeholder="Software developers"></textarea>
                <button type="submit">send</button>
            </form>
        </div>
    </body>
</html>
