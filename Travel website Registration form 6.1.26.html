<!DOCTYPE html>
<html>
<head>
<title>Register now for Free!</title>
<style>
    body{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: rgb(120, 183, 183);
    }
    .form-container{
        align-items: center;
        align: center
        width: 300px;
        margin-left: 40px;
        margin-top: 50px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 1);


    }

input,textarea{
    text-align: center;
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid cornsilk;
}
button{
    align-self: center;
    background-color: rgb(156, 113, 56);
    color: rgb(248, 244, 226);
    padding: 10px 15px;
    cursor: pointer;
}
button:hover{
    background-color: rgb(179, 143, 214);
}
h2{
    text-align: center;
}

</style>


   
   <style>
       body {
           background-image: url('https://static.vecteezy.com/system/resources/previews/002/197/924/large_2x/abstract-blur-beach-background-free-photo.jpg');
           background-repeat: no-repeat;
           background-size: cover;
       }
   </style>
</head>
<body>

    <div class="form-container">
        <h2>REGISTER HERE</h2>
        <form>
            First Name:<input type="text" placeholder="First Name" required>
            Last Name: <input type="text" placeholder="Last Name" required>
              Email:       <input type="email" placeholder="Email id" required>
            Create Password:<input type="password" placeholder="password" required>
            Re-Type Password:<input type="password" placeholder="password" required>
            Contact:<input type="number" placeholder="+91xxxxxxxxxx" required><br><br>
            Gender:
            <select name="Gender">
                <option>Male</option>
                <option>Female</option>
                <option>Others</option>
            </select> <br><br><br>
            Destination:
            <input type="text" placeholder="Where you want to travel to">
            From:
            <input type="text" placeholder="From where ">
            <button type="submit">Submit</button>
        
        </form>
    </div>
   
</body>
</html>
